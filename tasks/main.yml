---
- name: 'nut | Deploy'
  when:
    - "nut_enable | bool"
    - "nut_ups | length > 0 or nut_upsmon_monitor | length > 0"
  block:

    - name: 'nut | Add the OS specific variables'
      ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

    - name: 'nut | Assert that upsmon has credentials'
      ansible.builtin.assert:
        that:
          - "item['user'] is defined and item['user'] | length > 0"
          - "item['password'] is defined and item['password'] | length > 0"
        fail_msg: "MONITOR без user/password молча не подключится, и хост
          останется без выключения по низкому заряду: {{ item['ups'] | default('???') }}"
        quiet: true
      loop: "{{ nut_upsmon_monitor }}"
      loop_control:
        label: "{{ item['ups'] | default('???') }}"

    - name: 'nut | Install packages'
      ansible.builtin.package:
        name: "{{ nut_packages }}"
        state: "{{ nut_package_state }}"

    # Serial-порт принадлежит группе uucp/dialout, драйвер — пользователю nut.
    # Членство подхватывается при старте процесса: драйверы стартуют ниже,
    # уже с группой. Добавляем, не заменяя существующие группы.
    - name: 'nut | Grant serial-port group to the nut user'
      ansible.builtin.user:
        name: "{{ nut_user }}"
        groups: "{{ nut_serial_group }}"
        append: true
      when: "nut_serial_group | length > 0"

    # Чужой демон, поднятый раньше, займёт устройство, и драйвер NUT встанет
    # с ошибкой доступа. Гасим до раскладки конфигов.
    - name: 'nut | Stop conflicting services'
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: 'stopped'
        enabled: false
      loop: "{{ nut_conflicting_services }}"
      failed_when: false

    # Правила udev из пакета NUT срабатывают на СОБЫТИЕ подключения. Если ИБП
    # был воткнут раньше, чем поставили NUT, устройство остаётся root:root, и
    # драйвер падает с "insufficient permissions on everything". Перечитываем
    # правила и переигрываем события для USB — иначе лечится только
    # передёргиванием кабеля, а до него ещё надо доехать.
    - name: 'nut | Re-apply udev rules for already-connected USB devices'
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - 'udevadm control --reload-rules'
        - 'udevadm trigger --subsystem-match=usb'
      changed_when: false
      when:
        - "nut_ups | selectattr('driver', 'in', nut_usb_drivers) | list | length > 0"

    - name: 'nut | Deploy nut.conf'
      ansible.builtin.template:
        src: 'nut.conf.j2'
        dest: "{{ nut_conf_dir }}/nut.conf"
        owner: 'root'
        group: "{{ nut_group }}"
        mode: '0640'
      when: "nut_manage_config | bool"
      notify: ['nut restart drivers', 'nut restart upsd', 'nut restart upsmon']

    - name: 'nut | Deploy ups.conf'
      ansible.builtin.template:
        src: 'ups.conf.j2'
        dest: "{{ nut_conf_dir }}/ups.conf"
        owner: 'root'
        group: "{{ nut_group }}"
        mode: '0640'
      when: "nut_manage_config | bool"
      notify: ['nut restart drivers', 'nut restart upsd']

    - name: 'nut | Deploy upsd.conf'
      ansible.builtin.template:
        src: 'upsd.conf.j2'
        dest: "{{ nut_conf_dir }}/upsd.conf"
        owner: 'root'
        group: "{{ nut_group }}"
        mode: '0640'
      when: "nut_manage_config | bool"
      notify: 'nut restart upsd'

    # 0640 root:nut — обязательное: файл содержит пароли, а upsd читает его
    # уже под пользователем nut. Любые другие права = либо отказ старта,
    # либо пароли наружу.
    - name: 'nut | Deploy upsd.users'
      ansible.builtin.template:
        src: 'upsd.users.j2'
        dest: "{{ nut_conf_dir }}/upsd.users"
        owner: 'root'
        group: "{{ nut_group }}"
        mode: '0640'
      when: "nut_manage_config | bool"
      no_log: true
      notify: ['nut restart upsd', 'nut restart upsmon']

    - name: 'nut | Deploy upsmon.conf'
      ansible.builtin.template:
        src: 'upsmon.conf.j2'
        dest: "{{ nut_conf_dir }}/upsmon.conf"
        owner: 'root'
        group: "{{ nut_group }}"
        mode: '0640'
      when:
        - "nut_manage_config | bool"
        - "nut_upsmon_monitor | length > 0"
      no_log: true
      notify: 'nut restart upsmon'

    - name: 'nut | Deploy netdata go.d/upsd collector'
      ansible.builtin.template:
        src: 'netdata-upsd.conf.j2'
        dest: "{{ nut_netdata_conf_dir }}/go.d/upsd.conf"
        owner: 'root'
        group: 'root'
        mode: '0644'
      when: "nut_netdata_enable | bool"
      notify: 'nut restart netdata'

    # Снятие НЕ под гейтом enable: выключение интеграции обязано убирать и
    # свой конфиг тоже, иначе коллектор остаётся и продолжает опрашивать
    # мёртвый сокет — ровно та ложная тревога, от которой уходили.
    - name: 'nut | Drop stale netdata collectors'
      ansible.builtin.file:
        path: "{{ nut_netdata_conf_dir }}/go.d/{{ item }}.conf"
        state: 'absent'
      loop: "{{ nut_netdata_drop_collectors }}"
      notify: 'nut restart netdata'

    - name: 'nut | Remove own netdata collector when integration disabled'
      ansible.builtin.file:
        path: "{{ nut_netdata_conf_dir }}/go.d/upsd.conf"
        state: 'absent'
      when: "not (nut_netdata_enable | bool)"
      notify: 'nut restart netdata'

    - name: 'nut | Enumerate drivers'
      ansible.builtin.systemd_service:
        name: 'nut-driver-enumerator.service'
        enabled: "{{ nut_services_enable | bool }}"
        state: 'started'
      failed_when: false

    - name: 'nut | Enable upsd'
      ansible.builtin.systemd_service:
        name: 'nut-server.service'
        enabled: "{{ nut_services_enable | bool }}"
        state: 'started'
        daemon_reload: true
      # В check-режиме пакет не ставится, и на хосте без NUT юнита ещё нет:
      # задача упала бы, и проверить роль перед первой установкой стало бы
      # нельзя. На реальном прогоне ошибки не глушим.
      ignore_errors: "{{ ansible_check_mode | bool }}"

    - name: 'nut | Enable upsmon'
      ansible.builtin.systemd_service:
        name: 'nut-monitor.service'
        enabled: "{{ nut_services_enable | bool }}"
        masked: false
        state: 'started'
      when: "nut_upsmon_monitor | length > 0"
      # В check-режиме пакет не ставится, и на хосте без NUT юнита ещё нет:
      # задача упала бы, и проверить роль перед первой установкой стало бы
      # нельзя. На реальном прогоне ошибки не глушим.
      ignore_errors: "{{ ansible_check_mode | bool }}"

    # Пустой nut_upsmon_monitor значит "выключать хост некому". Одного
    # пропуска задачи мало: у nut.target статический Wants=nut-monitor.service,
    # и после перезагрузки upsmon поднимется со штатным конфигом, где нет ни
    # одной строки MONITOR, и упадёт. Маска — единственное, что это держит.
    - name: 'nut | Mask upsmon when no MONITOR configured'
      ansible.builtin.systemd_service:
        name: 'nut-monitor.service'
        state: 'stopped'
        enabled: false
        masked: true
      when: "nut_upsmon_monitor | length == 0"
      ignore_errors: "{{ ansible_check_mode | bool }}"

    - name: 'nut | Enable nut.target'
      ansible.builtin.systemd_service:
        name: 'nut.target'
        enabled: "{{ nut_services_enable | bool }}"
      when: "nut_services_enable | bool"
      # В check-режиме пакет не ставится, и на хосте без NUT юнита ещё нет:
      # задача упала бы, и проверить роль перед первой установкой стало бы
      # нельзя. На реальном прогоне ошибки не глушим.
      ignore_errors: "{{ ansible_check_mode | bool }}"

